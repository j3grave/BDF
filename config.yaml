# Configuração do pipeline local (Fase 1).
# O dataset pode ser alterado na linha de comandos: python run_pipeline.py --dataset 1m

dataset: small          # small | 1m | 32m
data_dir: data          # downloads, CSV normalizados e Parquet: data/<dataset>/...
results_dir: results    # tamanhos, tempos e benchmarks

# Fase 2 (passo cloud: python run_pipeline.py --dataset small --steps cloud).
# Este dataset (acima) é também o que os scripts da fase 2 usam por omissão.
# As credenciais NUNCA ficam aqui (vão para ~/.aws/credentials).
# O AWS Academy Learner Lab só permite us-east-1 e us-west-2.
#
# Buckets: null significa "derivado da conta". Cada aluno fica com os seus, sem configurar nada:
#   bdf26-g1-dados-<ID da conta>       ficheiros de data/cloud/<pasta>/
#   bdf26-g1-resultados-<ID da conta>  resultados das queries do Athena
# Para usar outros buckets, escreve aqui o nome ou passa --bucket-dados / --bucket-resultados.
# Não escrevas aqui nomes com o ID da conta: o config.yaml é versionado.
aws:
  region: us-east-1
  bucket_dados: null        # null = bdf26-g1-dados-<ID da conta>
  bucket_resultados: null   # null = bdf26-g1-resultados-<ID da conta>
  workgroup: primary
